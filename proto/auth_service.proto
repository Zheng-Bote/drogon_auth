syntax = "proto3";

package drogon_auth.grpc;

service AuthService {
    rpc GetUserStatus (UserStatusRequest) returns (UserStatusResponse);
    rpc CheckHealth (HealthCheckRequest) returns (HealthCheckResponse);
    rpc GetUserProfile (UserRequest) returns (UserProfileResponse);
    rpc GetUserCommunications (UserRequest) returns (UserCommunicationsResponse);
}

message UserRequest {
    string user_id = 1;
}

message UserStatusRequest {
    string session_id = 1;
}

message UserStatusResponse {
    bool is_authenticated = 1;
    string user_id = 2;
    repeated string roles = 3;
    bool is_active = 4;
}

message HealthCheckRequest {}

message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
    }
    ServingStatus status = 1;
    string db_status = 2;
}

message UserProfileResponse {
    string first_name = 1;
    string last_name = 2;
    string preferred_language = 3;
    string locale = 4;
    string timezone = 5;
    string attributes_json = 6;
}

message CommunicationEntry {
    string channel = 1;
    string address = 2;
    bool is_active = 3;
    bool verified = 4;
}

message UserCommunicationsResponse {
    repeated CommunicationEntry communications = 1;
}
